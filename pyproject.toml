[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "pygame-ce>=2.5.8",
]

[tool.uv.sources]
mazegenerator = { path = "maze/mazegenerator-2.1.0-py3-none-any.whl" }


# mazegenerator ships without type hints
[[tool.mypy.overrides]]
module = "mazegenerator"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
